name: diag-upbit
on: { workflow_dispatch: }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, time
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
               "Accept": "application/json", "Accept-Language": "ko-KR,ko;q=0.9", "Referer": "https://upbit.com/service_center/notice"}
          tests = [
            ("api-manager JSON", "https://api-manager.upbit.com/api/v1/announcements", {"os":"web","page":1,"per_page":5,"category":"trade"}, H),
            ("api-manager sans entetes", "https://api-manager.upbit.com/api/v1/announcements", {"os":"web","page":1,"per_page":5,"category":"trade"}, {}),
            ("page HTML notice", "https://upbit.com/service_center/notice", {}, H),
            ("api.upbit market/all", "https://api.upbit.com/v1/market/all", {}, H),
          ]
          for name, url, p, h in tests:
              for attempt in range(4):
                  try:
                      r = requests.get(url, params=p, headers=h, timeout=25)
                      print(f"{name:26s} essai {attempt+1}  HTTP {r.status_code}  {len(r.content):7d} o  {r.text[:90]!r}", flush=True)
                      if r.status_code == 200:
                          break
                  except Exception as e:
                      print(f"{name:26s} essai {attempt+1}  ERREUR {type(e).__name__}", flush=True)
                  time.sleep(20)
          PY
