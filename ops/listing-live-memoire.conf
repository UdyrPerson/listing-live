# A INSTALLER APRES LA PORTE MICRO-CAPS DU 2026-10-12 (14:50 UTC) : /etc/systemd/system/listing-live.service.d/memoire.conf, puis systemctl daemon-reload (pris au passage suivant).
# Fenetre : apres la porte de l'essai micro-caps, hors hh:55-hh:05 et hors des passages (hh:07/22/37/52 + ~80 s), inscrit au registre micro-caps.
# MemoryMax 512M = 6,3 x le pic mesure (81,4 Mio, memory.peak du passage de 2026-10-11 21:07, n = 1) : une fuite tue le passage (alerte
# ci-dessous) avant d'entamer la marge du scoreur (>= ~0,95 Gio restent). Sans swap : pages du passage jamais evincees vers le swap.
# OOMScoreAdjust -900 (pas -1000, qui rendrait la fuite impossible a tuer dans son propre cgroup) : dernier candidat d'un OOM global.
[Unit]
OnFailure=listing-live-alerte.service

[Service]
MemoryMax=512M
MemorySwapMax=0
OOMScoreAdjust=-900
